<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WuTang Gang</title>
    <link rel="stylesheet" href="CSS/wuTang.css">

    <link rel="stylesheet" href="">
</head>

<body>
    <h1>&#128527; Which character best describes who you are &#129300;</h1>

    <form action="submit" method="POST">
        <p>House Stark</p>
        <label> Who was your favorite?
            <input type="radio" name="a1" value="a" class="choice"> Ned Stark
            <input type="radio" name="a1" value="b" class="choices"> Sansa Stark
            <input type="radio" name="a1" value="c" class="choices"> Arya Stark
        </label>

         <p>House Lannister</p>
        <label> Who was the wealthiest?
            <input type="radio" name="a2" value="a" class="choice"> Tywin Lannister
            <input type="radio" name="a2" value="b" class="choice"> Cersei Lannister
            <input type="radio" name="a2" value="c" class="choice"> Jaime Lannister
        </label>

        <p>House Lannister</p>
        <label> Who was the wickedest?
            <input type="radio" name="a3" value="a" class="choice"> Cersei Lannister
            <input type="radio" name="a3" value="b" class="choice"> Tyrion Lannister
            <input type="radio" name="a3" value="c" class="choice"> Joffrey Baratheon/Lannister
        </label>

        <p>Hous of Evil</p>
        <label> Who needed to just go?
            <input type="radio" name="a4" value="a" class="choice"> Robert Baratheon
            <input type="radio" name="a4" value="b" class="choice"> Euron Greyjoy
            <input type="radio" name="a4" value="c" class="choice"> Joffrey Baratheon/Lannister
        </label>

         <p>House of Baddies</p>
        <label> Who were the baddies of the show
            <input type="radio" name="a5" value="a" class="choice"> John Snow
            <input type="radio" name="a5" value="b" class="choice"> Denerys Targaryen
            <input type="radio" name="a5" value="c" class="choice"> Arya Stark
        </label>

        <button type="button">&#128526; Generate a name &#128526;</button>

        <h3 id="savvyResults">Enter&#129319;</h3>
    </form>

    <script src="JS/wuTang.js"></script>
</body>

</html>
